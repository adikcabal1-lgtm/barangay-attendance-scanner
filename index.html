<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Barangay Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 550px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    #reader {
      margin-top: 20px;
    }

    .message {
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>
      Barangay Training<br>
      Attendance Scanner
    </h1>

    <label>
      Scanner PIN
    </label>

    <input
      type="password"
      id="pin"
      placeholder="Enter your scanner PIN">

    <input
      type="text"
      id="trainingId"
      value="TR-001"
      placeholder="Training ID">

    <input
      type="text"
      id="trainingName"
      value="Disaster Preparedness Training"
      placeholder="Training Name">

    <button onclick="startScanner()">
      📷 START SCANNING
    </button>

  </div>


  <div class="card">

    <div id="reader"></div>

  </div>


  <div id="result"></div>

</div>


<script>

let scanner = null;

let scannerRunning = false;

let lastToken = '';

let lastScanTime = 0;


function startScanner() {

  const pin =
    document.getElementById('pin').value.trim();

  const trainingId =
    document.getElementById('trainingId').value.trim();

  const trainingName =
    document.getElementById('trainingName').value.trim();


  if (!pin) {

    showMessage(
      'Please enter your scanner PIN.',
      'error'
    );

    return;

  }


  if (!trainingId || !trainingName) {

    showMessage(
      'Please enter the training information.',
      'error'
    );

    return;

  }


  if (scannerRunning) {
    return;
  }


  scanner =
    new Html5Qrcode('reader');


  scanner.start(

    {
      facingMode: 'environment'
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      const now = Date.now();


      if (
        decodedText === lastToken &&
        now - lastScanTime < 3000
      ) {

        return;

      }


      lastToken = decodedText;
      lastScanTime = now;


      recordAttendance(
        decodedText,
        pin,
        trainingId,
        trainingName
      );

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  )

  .then(function() {

    scannerRunning = true;

    showMessage(
      'Camera active. Scan a participant QR.',
      'success'
    );

  })

  .catch(function(error) {

    showMessage(
      'Unable to start camera: ' + error,
      'error'
    );

  });

}


function recordAttendance(
  token,
  pin,
  trainingId,
  trainingName
) {

  showMessage(
    'Checking participant...',
    'warning'
  );


  /*
   * We will connect this to Apps Script
   * in the next step.
   */

  console.log({
    token: token,
    pin: pin,
    trainingId: trainingId,
    trainingName: trainingName
  });


  showMessage(
    'QR detected. Backend connection will be added next.',
    'success'
  );

}


function showMessage(
  message,
  type
) {

  document.getElementById(
    'result'
  ).innerHTML =

    '<div class="message ' +
    type +
    '">' +
    message +
    '</div>';

}

</script>

</body>
</html>
